name: Build Dynamic Island Project APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate source and Android XML
        run: python3 scripts/validate_source.py

      - name: Read app version
        id: app-version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          test -n "$version_code"
          {
            echo "name=$version_name"
            echo "code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Configure stable debug signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CAPSULE_DEBUG_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CAPSULE_DEBUG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CAPSULE_DEBUG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CAPSULE_DEBUG_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "mode=ephemeral" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable debug signing is not configured. This APK may not install over APKs signed by another CI run."
            exit 0
          fi
          key_path="$RUNNER_TEMP/capsule-lite-debug.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_path"
          {
            echo "CAPSULE_DEBUG_KEYSTORE=$key_path"
            echo "CAPSULE_DEBUG_STORE_PASSWORD=$STORE_PASSWORD"
            echo "CAPSULE_DEBUG_KEY_ALIAS=$KEY_ALIAS"
            echo "CAPSULE_DEBUG_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "mode=stable" >> "$GITHUB_OUTPUT"

      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Name APK for sharing
        id: apk-name
        shell: bash
        env:
          APP_VERSION: ${{ steps.app-version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.app-version.outputs.code }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          apk_name="Dynamic Island Project-v${APP_VERSION}-build${APP_VERSION_CODE}-run${RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$apk_name"
          echo "name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Island-Project-v${{ steps.app-version.outputs.name }}-build${{ steps.app-version.outputs.code }}-debug-${{ steps.signing.outputs.mode }}-run-${{ github.run_number }}
          path: app/build/outputs/apk/debug/${{ steps.apk-name.outputs.name }}
          if-no-files-found: error
          retention-days: 14
